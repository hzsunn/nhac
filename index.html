<!DOCTYPE html>
<html lang="vi">
<head>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yêu Huyền ❤️</title>
   <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
 <style>
    #page-title {
      font-family: 'Great Vibes', cursive;
      font-size: 36px;
      color: hotpink;
      text-align: center;
      margin: 20px 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
  </style>
</head>
<body>

  <div class="app-container">
    <h1 id="page-title">Tài sản của Huyền</h1>
   <div class="search-wrapper">
  <input type="search" id="search" placeholder="Tìm bài hát..." />
  <button id="search-btn"><i class="fa fa-search"></i></button>
   </div>
   <div id="track-count"> Tổng số bài hát: 0</div>
   <p class="latest-track">爱你，宝贝 🤍</p>
   <p class="latest-track">👀: <span id="counter">Đang tải...</span></p>
  </div>
    <!-- ✅ Đưa bộ đếm vào đây -->
   <script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // 🔑 Config của bạn (thay vào đây)
    const firebaseConfig = {
      apiKey: "AIzaSyCp0cZQHy8BAEhB9GqYNKw1LjY6xd5tBjU",
  authDomain: "count-ab93f.firebaseapp.com",
  databaseURL: "https://count-ab93f-default-rtdb.firebaseio.com",
  projectId: "count-ab93f",
  storageBucket: "count-ab93f.firebasestorage.app",
  messagingSenderId: "186212159540",
  appId: "1:186212159540:web:928231a1dc222a56dafa61",
  measurementId: "G-HVYHDR5CQE"
};

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Hàm tăng bộ đếm
    async function updateCounter() {
      const counterRef = ref(db, "visitCount");

      // Lấy dữ liệu hiện tại
      const snapshot = await get(counterRef);
      let count = snapshot.exists() ? snapshot.val() : 0;

      // Tăng lên 1
      count++;

      // Lưu lại vào database
      await set(counterRef, count);

      // Hiển thị ra màn hình
      document.getElementById("counter").textContent = count;
    }

    // Gọi hàm khi load trang
    updateCounter();
  </script>
    <ul id="playlist" class="playlist"></ul>
  </div>
  
  

  <!-- Trình phát cố định dưới -->
  <div class="zing-player">
    <div class="left">
      <img id="track-img" src="bgr.JPG" />
      <div class="waveform" id="wave">
        <div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="info">
        <div id="track-title">Chưa chọn bài</div>
        <div id="track-artist">Không rõ nghệ sĩ</div>
      </div>
    </div>
       <!-- 👇 Karaoke nằm bên phải -->
  <div class="lyrics-box">
    <div id="karaoke" class="karaoke-lines"></div>
  </div>
    <div class="controls">
  <button id="prev-btn" class="btn">
    <i class="fa-solid fa-backward-step"></i>
  </button>

  <button id="play-btn" class="btn">
    <i id="play-icon" class="fa-solid fa-play"></i>
  </button>

  <button id="next-btn" class="btn">
    <i class="fa-solid fa-forward-step"></i>
  </button>
<div class="time-display">
    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
  </div>


  <input type="range" id="progress-bar" value="0" />

  </div>

  <audio id="audio-player"></audio>
   <script src="lyrics.js"></script>
  <script src="script.js"></script>
</body>
</html>
